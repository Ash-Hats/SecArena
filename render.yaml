services:
  - type: web
    name: secarena-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./data/secarena.db"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-frontend-domain.vercel.app"
    disk:
      name: secarena-sqlite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
